vortex_dashboard.title=Vortex 儀表板
vortex_dashboard.nav_item=Vortex
vortex_dashboard.description.paragraph1=Vortex 在編寫程式碼之前為您的代理程式提供上下文（Guide），並在編寫過程中修正問題（Verify），從而節省工程時間和 token。
vortex_dashboard.description.paragraph2=此儀表板列出了使用 Vortex 時每個專案的節省情況。閱讀我們的文件以<link>了解更多關於 Vortex 的資訊</link>。
