vortex_dashboard.impact_roi.guide.value=± {value}
vortex_dashboard.impact_roi.guide.value_label=已預防的問題
vortex_dashboard.impact_roi.guide.tooltip_title=已預防的問題（Guide）
vortex_dashboard.impact_roi.guide.tooltip_description=<p>已預防的問題是 Vortex Guide 在 Sonar 以代理程式為中心的開發週期（ACDC）中的估計成果。</p><p>Vortex Guide 為 AI 代理程式提供相關的上下文、護欄、標準和限制，協助其輸出在代理程式編寫程式碼之前及過程中都符合您組織的要求。</p><p>若沒有此上下文，代理程式可能會產生功能正確、但不符合您的編碼標準、架構或安全態勢的程式碼。</p>
vortex_dashboard.impact_roi.verify.heading=Vortex Verify
vortex_dashboard.impact_roi.verify.value_label=已解決的問題
vortex_dashboard.impact_roi.verify.tooltip_title=已解決的問題（Verify）
vortex_dashboard.impact_roi.verify.tooltip_description=<p>已解決的問題是 Vortex Verify 在 Sonar 以代理程式為中心的開發週期（ACDC）中的實測成果。</p><p>當代理程式編寫程式碼時，Vortex Verify 會使用 SonarQube 規則分析變更，並回傳發現項目供代理程式處理。</p><p>當問題在一次分析中被發現，並在代理程式更新程式碼且 Vortex 再次驗證後不再出現時，該問題即計為已解決。</p><p>這有助於在變更進入拉取請求之前解決問題，減少下游返工。</p>
vortex_dashboard.impact_roi.engineering_time.heading=節省的工程時間
vortex_dashboard.impact_roi.engineering_time.value_label=節省的小時數
vortex_dashboard.impact_roi.engineering_time.tooltip_title=預計節省的時間
vortex_dashboard.impact_roi.engineering_time.tooltip_description=<p>估計 Vortex 透過及早發現或預防問題，協助避免耗費的工程時間。</p><p>此估計採用 Sonar 的修復工作，以及對審查和返工的保守假設。</p>
vortex_dashboard.impact_roi.tokens.heading=節省的 token
vortex_dashboard.impact_roi.tokens.value_label=節省的 token
vortex_dashboard.impact_roi.tokens.tooltip_title=估計節省的 token
vortex_dashboard.impact_roi.tokens.tooltip_description=估計 Vortex 透過提供聚焦的上下文、而不需要代理程式探索更多程式碼庫，所協助避免的 token 量。
vortex_dashboard.impact_roi.badge.estimate=估計
vortex_dashboard.impact_roi.badge.measured=實測
vortex_dashboard.impact_roi.badge.estimate_description=此值是根據觀察到的 Vortex 活動和對沒有它可能發生的事情的保守假設計算得出的。它不是直接觀察到的結果。
vortex_dashboard.impact_roi.badge.measured_description=此值基於 Vortex 直接觀察到的活動，例如在兩次分析之間解決的問題，或提供給代理程式的規則。
vortex_dashboard.impact_roi.engineering_time_modal.title=如何計算節省的工程時間
vortex_dashboard.impact_roi.engineering_time_modal.intro=節省的工程時間是估計 Vortex 在程式碼進入審查或 CI 之前協助避免的返工。
vortex_dashboard.impact_roi.engineering_time_modal.methodology=我們根據 Vortex Guide 和 Verify 活動，使用 Sonar 規則修復工作和保守假設計算。這不是對個別開發人員時間的衡量。
vortex_dashboard.impact_roi.engineering_time_modal.total_label=預計節省的總時間
vortex_dashboard.impact_roi.engineering_time_modal.total_formula=Guide 貢獻 + Verify 貢獻
vortex_dashboard.impact_roi.engineering_time_modal.guide_contribution_title=Guide 貢獻（估計預防）
vortex_dashboard.impact_roi.engineering_time_modal.guide_contribution_description=當 Guide 提供專案規則時，若問題原本會進入審查，我們會估計因此避免的返工。
vortex_dashboard.impact_roi.engineering_time_modal.guide_formula=估計預防的問題 × 問題原本會進入審查的可能性 ×（Sonar 修復工作 + 審查時間）
vortex_dashboard.impact_roi.engineering_time_modal.verify_contribution_title=Verify 貢獻（已解決的問題）
vortex_dashboard.impact_roi.engineering_time_modal.verify_contribution_description=當 Verify 發現問題，而後續分析不再發現該問題時，我們會估計在代理程式工作流程中處理該問題所避免的返工。
vortex_dashboard.impact_roi.engineering_time_modal.verify_formula=問題原本會被修正的可能性 × 調整後的 Sonar 修復工作 + 問題會進入審查的可能性 × 一次估計的審查往返
vortex_dashboard.impact_roi.engineering_time_modal.whats_included=包含哪些項目？
vortex_dashboard.impact_roi.engineering_time_modal.whats_included.items=<li><b>Sonar 修復工作：</b>修復每條 Sonar 規則相關問題的標準估計時間。</li><li><b>審查時間：</b>對所避免的審查、修正和重新審查循環的保守估計。</li><li><b>保守調整：</b>機率和批次調整可避免估計時將每項發現都視為一個完整、獨立的返工週期。</li>
vortex_dashboard.impact_roi.engineering_time_modal.guardrail_title=護欄 / 信任說明
vortex_dashboard.impact_roi.engineering_time_modal.guardrail_description=我們估計這些問題原本會在您正常的拉取請求工作流程中被發現，而不會造成事故或資安外洩。共用的審查工作依每次代理程式活動計算一次，而不是每個問題各計算一次。
vortex_dashboard.impact_roi.tokens_modal.title=如何計算節省的 token
vortex_dashboard.impact_roi.tokens_modal.intro=節省的 token 是估計 Vortex 協助避免的代理程式輸入 token 量。
vortex_dashboard.impact_roi.tokens_modal.methodology=Vortex 減少了不必要的程式碼庫探索，並在將大型命令輸出新增到代理程式上下文之前對其進行壓縮。
vortex_dashboard.impact_roi.tokens_modal.total_label=估計節省的 token
vortex_dashboard.impact_roi.tokens_modal.total_formula=導覽節省
vortex_dashboard.impact_roi.tokens_modal.navigation_title=導覽節省（聚焦的程式碼庫導覽）
vortex_dashboard.impact_roi.tokens_modal.navigation_description=當 Vortex 回答有關程式碼庫結構的問題時，我們會估計代理程式原本用於搜尋和讀取程式碼的 token，再減去 Vortex 回應的大小。
vortex_dashboard.impact_roi.tokens_modal.formula=max(0, (估計的探索 token − Vortex 回應 token) × 上下文放大係數*)
vortex_dashboard.impact_roi.tokens_modal.amplification_footnote=*上下文放大係數：新增到代理程式上下文中的資訊可能會在之後的請求中再次傳送。放大係數使用保守的固定值估算此重複輸入的成本。
vortex_dashboard.impact_roi.tokens_modal.trust_note_title=信任說明
vortex_dashboard.impact_roi.tokens_modal.trust_note=回應大小和壓縮位元組變化是觀察所得。代理程式原本會使用的 token 及上下文放大的影響則為估計值，因此此指標標示為「估計」。
