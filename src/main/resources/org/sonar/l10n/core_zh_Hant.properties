sca.licenses.category.copyleft_maximal=最大範圍的 Copyleft 授權回答了一個問題：「授權在什麼情況下要求您分享？」與其他類型不同，最大範圍的 Copyleft 授權要求您與他人共享您的軟體，並以相同方式授權該軟體。範例包括 Parity 授權和 Reciprocal 軟體授權。
sca.licenses.category.copyleft_maximal.name=最大範圍 Copyleft
sca.licenses.category.copyleft_network=除了強制性 Copyleft 授權的要求外，網路 Copyleft 授權還要求您分享更大規模的程式碼，不僅限於當您向他人提供副本時，也涵蓋您在網路上運行該軟體供他人使用時。範例包括 GNU AGPL 及 Server-Side-Public License 授權。
sca.licenses.category.copyleft_network.name=網路 Copyleft
sca.licenses.category.copyleft_strong=除了弱 Copyleft 授權的要求外，強 Copyleft 授權要求當您向他人提供副本時，也必須分享您使用受授權軟體建立的更大程式碼。範例包括 GNU GPL 授權。
sca.licenses.category.copyleft_strong.name=強制性 Copyleft
sca.licenses.category.copyleft_weak=弱 Copyleft 授權要求當您向他人提供副本時，分享您的變更及擴充內容。範例包括 GNU LGPL 及 Mozilla Public License 授權。
sca.licenses.category.copyleft_weak.name=弱 Copyleft
sca.licenses.category.filter_by_category=依類別篩選
sca.licenses.category.permissive_amateur=此類別包含不符合現代開源授權的基本要素，或具有複雜或模糊要求的開放式授權。許多授權使用不清楚、幽默或不完整的語言，使其在法律層面上較不具可預測性。範例包括 Artistic 1.0 及 WTFPL 軟體授權。
sca.licenses.category.permissive_amateur.name=非標準寬鬆授權
sca.licenses.category.permissive_standard=此類別包含最常用的開放式授權。寬鬆授權允許使用和修改，並且義務要求極少（主要是署名）。此類別的授權具備所有開放式授權的基本要素。範例包括 MIT 授權及 Apache 軟體授權。
