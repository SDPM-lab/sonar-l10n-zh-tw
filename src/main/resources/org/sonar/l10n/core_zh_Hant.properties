component_measures.overview.project_overview.title=風險
component_measures.overview.project_overview.description=快速了解操作風險。綠色之外的顏色表示風險：包含 Bug 或漏洞。右上方的圖像表示長期看來存在風險。左下側的綠色氣泡表示品質最佳。
component_measures.overview.Reliability.description=了解 Bug 的操作風險。氣泡越紅，Bug 越嚴重。氣泡大小表示 Bug 的規模，氣泡垂直位置反應了定位 Bug 的時間。底部的小綠氣泡表示品質最佳。
component_measures.overview.Security.description=了解漏洞的操作風險。氣泡越紅，漏洞越嚴重。氣泡大小表示漏洞的規模，氣泡垂直位置反應了定位漏洞的時間。底部的小綠氣泡表示品質最佳。
component_measures.overview.Maintainability.description=了解程式碼怪味長期風險。氣泡越紅，技術債評級越高。氣泡大小表示怪味的規模，氣泡垂直位置反應了覆蓋的缺失程度。底部的小綠氣泡表示品質最佳。
component_measures.overview.Coverage.description=了解缺失測試覆蓋的長期風險。氣泡大小表示未覆蓋行數，氣泡垂直位置反映了覆蓋的缺失程度。底部的小氣泡表示品質最佳。
component_measures.overview.Duplications.description=了解重複程式碼的長期風險。氣泡大小表示重複層度，氣泡垂直位置反應了重複行數。底部的小氣泡表示品質最佳。
component_measures.overview.see_data_as_list=將圖表數據展示為列表
component_measures.domain_subnavigation.Reliability.help=這個區域對應的程式碼，會遇到更多期望外的問題。
component_measures.domain_subnavigation.Maintainability.help=這個區域對應的程式碼，會發現比預期更難維護。
component_measures.domain_subnavigation.Security.help=這個區域對應的程式碼，可能被黑客攻擊。
component_measures.domain_subnavigation.SecurityReview.help=這個區域對應的潛在安全風險，包含熱點和審查狀態。
component_measures.domain_subnavigation.Complexity.help=應用的控制流是簡單還是複雜。圈複雜度可以計算出達到全面覆蓋需要的最少測試用例。認知複雜度對應這個應用是否很難被理解。
