dependencies.risk.how.malware.body=雖然每個惡意套件的情況都不同，但以下是一些通用的指引原則：<li>立即通知您的資訊安全團隊。</li><li>從專案中移除該套件，解除安裝並刪除依賴檔案中的相關項目。</li><li>重新設定所有可能已外洩的秘密與憑證，包括 API 金鑰、密碼、權杖與憑證。請在另一台安全的電腦上執行此操作。</li><li>檢查系統是否遭到入侵，包括是否有異常的程序、網路連線或檔案修改。必要時考慮從乾淨的備份還原或重新安裝受影響的系統。</li><li>若有安全版本，請更新至安全版本，或尋找替代套件。請檢查套件的版本庫與安全公告以獲取指引。</li><li>掃描您的程式碼庫，檢查在套件執行期間是否有惡意程式碼被注入到專案檔案中。</li><li>檢視您的安全實務，包括如何審核依賴套件，並考慮使用在安裝前能掃描惡意套件的工具。</li>
